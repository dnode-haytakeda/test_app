# .github/workflows/deploy.yml
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: test-app/backend
  ECS_CLUSTER: test-app-cluster
  ECS_SERVICE: test-app-backend
  S3_BUCKET: test-app-frontend-production

jobs:
  # ==============================
  # テスト
  # ==============================
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: 
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Type check
        working-directory: backend
        run: mypy app/
      - name: test
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        run: pytest --cov=app --cov-report=xml
  
  test-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: build
        working-directory: frontend
        run: npm run build
  
  # ==============================
  # バックエンドデプロイ
  # ==============================
  deploy-backend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # OIDC で AWS 認証
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      # ECR にログイン
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      
      # Docker イメージのビルド & プッシュ
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            -f backend/Dockerfile.prod \
            backend/
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
      
      # DB マイグレーション実行
      - name: Run migrations
        run: |
          aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition test-app-migration \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-xxx],securityGroups=[sg-xxx]}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["alembic","upgrade","head"]}]}'
      
      # タスク定義を更新
      - name: Update task definition
        id: task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_SERVICE \
            --query 'taskDefinition' > task-def.json
          
          jq --arg IMAGE "${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}" \
            '.containerDefinitions[0].image = $IMAGE' task-def.json > updated-task-def.json

          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            updated-task-def.json > clean-task-def.json

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://clean-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
      
      # ECS サービスを更新
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition ${{ steps.task-def.outputs.arn }} \
            --force-new-deployment
      
      # デプロイ完了を待つ
      - name: Wait for stability
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE
      # 失敗時にログを収集
      - name: Collect failure info
        if: failure()
        run: | 
          echo "::error::デプロイが失敗しました"
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].events[:10]'

  # ==============================
  # フロントエンドデプロイ
  # ==============================
  deploy-frontend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.com/api
        run: |
          npm ci
          npm run build

      - name: Deploy to S3
        run: |
          # アセット: 1年キャッシュ (Vite がハッシュ付きファイル名を生成)
          aws s3 sync frontend/dist/ s3://$S3_BUCKET/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"

          # index.html: キャッシュなし (常に最新を返す)
          aws s3 cp frontend/dist/index.html s3://$S3_BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"



